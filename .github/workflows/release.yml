name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk flutter_media_view-${{ github.ref_name }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_media_view-*-android.apk

  build-linux:
    name: Linux Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Archive bundle
        run: |
          cd build/linux/x64/release
          tar czf ../../../flutter_media_view-${{ github.ref_name }}-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/flutter_media_view-*-linux-x64.tar.gz

  build-ios:
    name: iOS IPA (no codesign)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r flutter_media_view-${{ github.ref_name }}-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/flutter_media_view-*-ios.ipa

  release:
    name: Create GitHub Release
    needs: [build-android, build-linux, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android-apk/*.apk
            artifacts/linux-bundle/*.tar.gz
            artifacts/ios-ipa/*.ipa
