name: flutter_media_view
description: A cross-platform media gallery and metadata explorer app.
publish_to: none

version: 1.14.9+173

environment:
  # this project bundles Flutter SDK via `flutter_wrapper`
  # cf https://github.com/passsy/flutter_wrapper
  flutter: ">=3.44.0"
  sdk: ">=3.12.0 <4.0.0"

platforms:
  android:
  ios:
  linux:

workspace:
  - plugins/aves_magnifier
  - plugins/aves_map
  - plugins/aves_model
  - plugins/aves_report
  - plugins/aves_report_console
  - plugins/aves_screen_state
  - plugins/aves_services
  - plugins/aves_services_none
  - plugins/aves_ui
  - plugins/aves_utils
  - plugins/aves_video
  - plugins/aves_video_exo
  - plugins/aves_video_mpv

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  aves_magnifier:
    path: plugins/aves_magnifier
  aves_map:
    path: plugins/aves_map
  aves_model:
    path: plugins/aves_model
  aves_report:
    path: plugins/aves_report
  aves_report_platform:
    path: plugins/aves_report_console
  aves_screen_state:
    path: plugins/aves_screen_state
  aves_services:
    path: plugins/aves_services
  aves_services_platform:
    path: plugins/aves_services_none
  aves_video:
    path: plugins/aves_video
  #  aves_video_exo:
  #    path: plugins/aves_video_exo
  aves_video_mpv:
    path: plugins/aves_video_mpv
  aves_ui:
    path: plugins/aves_ui
  aves_utils:
    path: plugins/aves_utils
  collection:
  community_charts_flutter:
    git:
      url: https://github.com/deckerst/flutter_community_charts.git
      ref: aves
      path: community_charts_flutter
  connectivity_plus: ^6.1.0
  country_code:
  crypto:
  csv:
  decorated_icon:
  device_info_plus:
  dlna_dart:
  dynamic_color:
  equatable:
  event_bus:
  file_picker:
  expansion_tile_card:
    git:
      url: https://github.com/deckerst/expansion_tile_card.git
  flex_color_picker:
  floating:
    git:
      url: https://github.com/deckerst/floating.git
      ref: agp9
  fluster:
  flutter_displaymode:
  flutter_highlight:
  flutter_localizations_plus:
    git:
      url: https://github.com/deckerst/flutter_localizations_plus.git
  flutter_map:
  flutter_markdown_plus:
  flutter_staggered_animations:
    git:
      url: https://github.com/deckerst/flutter_staggered_animations
      ref: aves
  get_it:
  gpx:
  highlight:
  http:
  image:
  intl:
  intl4x: 1.0.0-alpha.2
  latlong2:
  leak_tracker:
  local_auth:
  material_color_utilities:
  flutter_material_design_icons:
  material_symbols_icons:
  network_info_plus:
  overlay_support:
    git:
      url: https://github.com/deckerst/overlay_support.git
      ref: aves
  package_info_plus:
  panorama:
    git:
      url: https://github.com/deckerst/aves_panorama.git
      ref: aves
  path:
  path_provider:
  pattern_lock:
  pdf:
  percent_indicator:
    git:
      url: https://github.com/deckerst/flutter_percent_indicator.git
      ref: aves
  permission_handler:
  pin_code_fields:
  printing:
  proj4dart:
  provider:
  screen_brightness:
  shamsi_date:
  shared_preferences:
  shelf:
  smooth_page_indicator:
  sqflite:
  sqflite_common_ffi:
  stack_trace:
  streams_channel:
    git:
      url: https://github.com/deckerst/aves_streams_channel.git
  synchronized:
  url_launcher:
  # `vector_map_tiles` v10.0.0-beta API is unclear to provide sprites
  vector_map_tiles: ^9.0.0-beta
  vector_math:
  vector_tile_renderer:
  volume_controller:
  video_thumbnail:
  xml:

dependency_overrides:
  media_kit_video:
    git:
      url: https://github.com/deckerst/media-kit.git
      path: media_kit_video
      ref: video_controller_disposal

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  shared_preferences_platform_interface:
  test:

flutter:
  assets:
    - assets/
  generate: true
  uses-material-design: true
