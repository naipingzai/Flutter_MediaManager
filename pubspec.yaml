name: flutter_media_view
description: A cross-platform media gallery and metadata explorer app.
publish_to: none

version: 1.14.9+173

environment:
  # this project bundles Flutter SDK via `flutter_wrapper`
  # cf https://github.com/passsy/flutter_wrapper
  flutter: ">=3.44.0"
  sdk: ">=3.12.0 <4.0.0"

platforms:
  android:
  ios:
  linux:

workspace:
  - plugins/flutter_media_view_magnifier
  - plugins/flutter_media_view_map
  - plugins/flutter_media_view_model
  - plugins/flutter_media_view_report
  - plugins/flutter_media_view_report_console
  - plugins/flutter_media_view_screen_state
  - plugins/flutter_media_view_services
  - plugins/flutter_media_view_services_none
  - plugins/flutter_media_view_ui
  - plugins/flutter_media_view_utils
  - plugins/flutter_media_view_video
  - plugins/flutter_media_view_video_exo
  - plugins/flutter_media_view_video_mpv
  - plugins/flutter_media_view_panorama
  - plugins/flutter_media_view_streams_channel

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_media_view_magnifier:
    path: plugins/flutter_media_view_magnifier
  flutter_media_view_map:
    path: plugins/flutter_media_view_map
  flutter_media_view_model:
    path: plugins/flutter_media_view_model
  flutter_media_view_report:
    path: plugins/flutter_media_view_report
  flutter_media_view_report_platform:
    path: plugins/flutter_media_view_report_console
  flutter_media_view_screen_state:
    path: plugins/flutter_media_view_screen_state
  flutter_media_view_services:
    path: plugins/flutter_media_view_services
  flutter_media_view_services_platform:
    path: plugins/flutter_media_view_services_none
  flutter_media_view_video:
    path: plugins/flutter_media_view_video
  #  flutter_media_view_video_exo:
  #    path: plugins/flutter_media_view_video_exo
  flutter_media_view_video_mpv:
    path: plugins/flutter_media_view_video_mpv
  flutter_media_view_ui:
    path: plugins/flutter_media_view_ui
  flutter_media_view_utils:
    path: plugins/flutter_media_view_utils
  collection:
  community_charts_flutter:
    git:
      url: https://github.com/deckerst/flutter_community_charts.git
      ref: main
      path: community_charts_flutter
  connectivity_plus: ^6.1.0
  country_code:
  crypto:
  csv:
  decorated_icon:
  device_info_plus: ^11.3.0
  dlna_dart:
  dynamic_color:
  equatable:
  event_bus:
  file_picker: ^11.0.0
  expansion_tile_card:
    git:
      url: https://github.com/deckerst/expansion_tile_card.git
  flex_color_picker:
  floating:
    git:
      url: https://github.com/deckerst/floating.git
      ref: agp9
  fluster:
  flutter_displaymode:
  flutter_highlight:
  flutter_localizations_plus:
    git:
      url: https://github.com/deckerst/flutter_localizations_plus.git
  flutter_map:
  flutter_markdown_plus:
  flutter_staggered_animations:
    git:
      url: https://github.com/deckerst/flutter_staggered_animations
      ref: main
  get_it:
  gpx:
  highlight:
  http:
  image:
  intl:
  intl4x: 1.0.0-alpha.2
  latlong2:
  leak_tracker:
  local_auth:
  material_color_utilities:
  flutter_material_design_icons:
  material_symbols_icons:
  network_info_plus:
  overlay_support:
    git:
      url: https://github.com/deckerst/overlay_support.git
      ref: main
  package_info_plus:
  flutter_media_view_panorama:
    path: plugins/flutter_media_view_panorama
  path:
  path_provider:
  pattern_lock:
  pdf:
  percent_indicator:
    git:
      url: https://github.com/deckerst/flutter_percent_indicator.git
      ref: main
  permission_handler:
  pin_code_fields:
  printing:
  proj4dart:
  provider:
  screen_brightness:
  shamsi_date:
  share_plus:
  shared_preferences:
  shelf:
  smooth_page_indicator:
  sqflite:
  sqflite_common_ffi:
  stack_trace:
  flutter_media_view_streams_channel:
    path: plugins/flutter_media_view_streams_channel
  synchronized:
  url_launcher:
  # `vector_map_tiles` v10.0.0-beta API is unclear to provide sprites
  vector_map_tiles: ^9.0.0-beta
  vector_math:
  vector_tile_renderer:
  volume_controller:
  video_thumbnail:
  xml:

dependency_overrides:
  media_kit_video:
    git:
      url: https://github.com/deckerst/media-kit.git
      path: media_kit_video
      ref: video_controller_disposal

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  shared_preferences_platform_interface:
  test:

flutter:
  assets:
    - assets/
  generate: true
  uses-material-design: true
