name: flutter_media_manager
description: "生活动态 - 记录美好生活 (本地发布动态APP)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  provider: ^6.1.2

  # 图片查看
  photo_view: ^0.15.0

  # HTTP 客户端（WebDAV 支持）
  dio: ^5.4.0

  # 图片缓存
  cached_network_image: ^3.4.1

  # 日志
  logger: ^2.4.0

  # 共享偏好设置
  shared_preferences: ^2.3.2

  # 文件路径
  path_provider: ^2.1.4

  # 图片选择
  image_picker: ^1.1.2

  # 视频播放
  video_player: ^2.9.2
  # 视频缩略图
  video_thumbnail: ^0.5.6

  # 音频播放
  just_audio: ^0.9.40

  # UUID 生成
  uuid: ^4.5.1

  # 加密
  encrypt: ^5.0.3
  crypto: ^3.0.7

  # 主题/动态颜色
  dynamic_color: ^1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
